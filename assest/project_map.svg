<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#13222e"/>
      <stop offset="55%" stop-color="#0c131b"/>
      <stop offset="100%" stop-color="#080c12"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="960" height="540" rx="14" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="960" height="540" rx="14" fill="url(#dotGrid)"/>

  <!-- Header -->
  <text x="42" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2.2" fill="#34d399">PROJECT MAP / 2026</text>
  <text x="42" y="72" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">The languages &amp; tools behind what I build</text>
  <text x="42" y="96" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">A connected view of my core programming languages, frameworks, and shipped apps.</text>

  <!-- Connection Lines -->
  <g stroke="#334155" stroke-width="1.4" opacity="0.8">
    <!-- Center (480, 295) to main language & project hubs -->
    <line x1="480" y1="295" x2="290" y2="205" stroke="#38bdf8" stroke-width="1.8" opacity="0.65"/>
    <line x1="480" y1="295" x2="480" y2="165" stroke="#38bdf8" stroke-width="1.8" opacity="0.65"/>
    <line x1="480" y1="295" x2="670" y2="205" stroke="#38bdf8" stroke-width="1.8" opacity="0.65"/>
    <line x1="480" y1="295" x2="650" y2="410" stroke="#eab308" stroke-width="1.8" opacity="0.65"/>
    <line x1="480" y1="295" x2="480" y2="435" stroke="#34d399" stroke-width="1.8" opacity="0.65"/>
    <line x1="480" y1="295" x2="310" y2="405" stroke="#34d399" stroke-width="1.8" opacity="0.65"/>
    <line x1="480" y1="295" x2="155" y2="295" stroke="#34d399" stroke-width="1.6" opacity="0.55"/>
    <line x1="480" y1="295" x2="805" y2="295" stroke="#38bdf8" stroke-width="1.6" opacity="0.55"/>

    <!-- Cross-links -->
    <line x1="290" y1="205" x2="480" y2="165"/>
    <line x1="290" y1="205" x2="155" y2="295"/>
    <line x1="290" y1="205" x2="310" y2="405" stroke="#34d399" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="670" y1="205" x2="805" y2="295"/>
    <line x1="670" y1="205" x2="650" y2="410" stroke="#34d399" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="155" y1="295" x2="310" y2="405"/>
    <line x1="310" y1="405" x2="480" y2="435"/>
    <line x1="480" y1="435" x2="650" y2="410"/>
    <line x1="805" y1="295" x2="790" y2="425"/>
    <line x1="650" y1="410" x2="790" y2="425"/>
    <line x1="310" y1="405" x2="175" y2="435"/>
  </g>

  <!-- Nodes: Programming Languages -->
  <!-- JS -->
  <g transform="translate(290, 205)">
    <circle r="34" fill="#172554" stroke="#38bdf8" stroke-width="2.2"/>
    <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="800" fill="#ffffff">JS</text>
    <text y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">JavaScript</text>
  </g>

  <!-- React -->
  <g transform="translate(480, 165)">
    <circle r="30" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">React</text>
    <text y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Frontend UI</text>
  </g>

  <!-- Node.js -->
  <g transform="translate(670, 205)">
    <circle r="32" fill="#172554" stroke="#38bdf8" stroke-width="2.2"/>
    <text y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#ffffff">Node</text>
    <text y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Node.js</text>
  </g>

  <!-- MongoDB / Supabase -->
  <g transform="translate(805, 295)">
    <circle r="30" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">MDB</text>
    <text y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">MongoDB · Supa</text>
  </g>

  <!-- Python -->
  <g transform="translate(480, 435)">
    <circle r="31" fill="#064e3b" stroke="#34d399" stroke-width="2.2"/>
    <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#ffffff">Py</text>
    <text y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Python</text>
  </g>

  <!-- C++ / DSA -->
  <g transform="translate(650, 410)">
    <circle r="32" fill="#422006" stroke="#eab308" stroke-width="2.2"/>
    <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#ffffff">C++</text>
    <text y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">DSA · CodeVita</text>
  </g>

  <!-- MySQL / Express -->
  <g transform="translate(790, 425)">
    <circle r="25" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8"/>
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">SQL</text>
    <text y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">MySQL · Docker</text>
  </g>

  <g transform="translate(175, 435)">
    <circle r="25" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8"/>
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">API</text>
    <text y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Express.js</text>
  </g>

  <!-- Shipped Projects -->
  <g transform="translate(155, 295)">
    <circle r="33" fill="#064e3b" stroke="#34d399" stroke-width="2.2"/>
    <text y="1" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">RESUME</text>
    <text y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">FORGE</text>
    <text y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Resume Builder</text>
  </g>

  <g transform="translate(310, 405)">
    <circle r="34" fill="#064e3b" stroke="#34d399" stroke-width="2.2"/>
    <text y="2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">MOODIFY</text>
    <text y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">AI Music App</text>
  </g>

  <!-- Center Developer Hub -->
  <g transform="translate(480, 295)" filter="url(#glow)">
    <circle r="46" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <text y="-2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">HJ</text>
    <text y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#34d399">DEVELOPER</text>
  </g>

  <!-- Legend -->
  <g transform="translate(42, 515)" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <circle cx="6" cy="-4" r="5" fill="#38bdf8"/>
    <text x="18" y="0">Web &amp; MERN Stack</text>
    <circle cx="155" cy="-4" r="5" fill="#34d399"/>
    <text x="167" y="0">Python &amp; Shipped Apps</text>
    <circle cx="325" cy="-4" r="5" fill="#eab308"/>
    <text x="337" y="0">C++ &amp; DSA</text>
    <circle cx="430" cy="-4" r="5" fill="#94a3b8"/>
    <text x="442" y="0">Databases &amp; Tools</text>
  </g>
</svg>