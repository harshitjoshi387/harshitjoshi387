    <circle r="56" fill="#0f172a" stroke="#dc2626" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#ff4500" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <text y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">HJ</text>
  </g>
